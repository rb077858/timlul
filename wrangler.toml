# Cloudflare Worker: serves the site (public/) and the API (/api/*).
name = "timlul"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Variables you set in the Cloudflare dashboard survive every deploy.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# The database: a SQLite Durable Object (free plan, no setup needed).
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[observability]
enabled = true
